<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation | Smart Krishi Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="crop-bg">
    <div id="emoji-loader" class="emoji-loader">
        <div class="emoji-loader-orbit">
            <span>🌾</span>
            <span>☁️</span>
            <span>🌱</span>
            <span>🌦️</span>
            <div class="emoji-loader-center">🚜</div>
        </div>
    </div>
    <div class="lang-switch">
        <a class="lang-pill {% if current_lang == 'en' %}active{% endif %}" href="{{ url_for('set_language', lang_code='en', next=request.full_path) }}">EN</a>
        <a class="lang-pill {% if current_lang == 'hi' %}active{% endif %}" href="{{ url_for('set_language', lang_code='hi', next=request.full_path) }}">HI</a>
        <a class="lang-pill {% if current_lang == 'te' %}active{% endif %}" href="{{ url_for('set_language', lang_code='te', next=request.full_path) }}">TE</a>
        {% if current_user %}
        <a class="lang-pill" href="{{ url_for('logout') }}">{{ t('logout') }}</a>
        {% endif %}
    </div>
    <a href="/home" class="home-shortcut left"><i class="fa fa-home"></i></a>
    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
        <div class="crop-transparent-box p-4">
            <h2 class="mb-4 text-center">{{ t('crop_page_title') }}</h2>
            <form method="POST" class="crop-form">
                <div class="row crop-input-row mb-3">
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="N" placeholder="{{ t('crop_field_n') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="P" placeholder="{{ t('crop_field_p') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="K" placeholder="{{ t('crop_field_k') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="temperature" placeholder="{{ t('crop_field_temp') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="humidity" placeholder="{{ t('crop_field_hum') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="ph" placeholder="{{ t('crop_field_ph') }}" class="form-control crop-input" required></div>
                    <div class="col-12 col-md-6 mb-3"><input type="number" step="any" name="rainfall" placeholder="{{ t('crop_field_rain') }}" class="form-control crop-input" required></div>
                </div>
                <button type="submit" class="btn btn-primary w-100 crop-btn">{{ t('crop_recommend_button') }}</button>
            </form>
            {% if result %}
            <div class="crop-result mt-3">🌱 Recommended Crop: <b>{{ result }}</b></div>
            {% endif %}
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loader = document.getElementById('emoji-loader');
            if (!loader) return;
            loader.classList.add('show');
            setTimeout(() => loader.classList.remove('show'), 1000);
        });
    </script>
</body>
</html>
