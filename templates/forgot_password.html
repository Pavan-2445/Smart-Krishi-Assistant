<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t('forgot_title') }} | {{ t('app_name') }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
  <div id="emoji-loader" class="emoji-loader">
    <div class="emoji-loader-orbit">
      <span>🌾</span>
      <span>☁️</span>
      <span>🌱</span>
      <span>🌦️</span>
      <div class="emoji-loader-center">🚜</div>
    </div>
  </div>

  <div class="lang-switch">
    <a class="lang-pill {% if current_lang == 'en' %}active{% endif %}" href="{{ url_for('set_language', lang_code='en', next=request.full_path) }}">EN</a>
    <a class="lang-pill {% if current_lang == 'hi' %}active{% endif %}" href="{{ url_for('set_language', lang_code='hi', next=request.full_path) }}">HI</a>
    <a class="lang-pill {% if current_lang == 'te' %}active{% endif %}" href="{{ url_for('set_language', lang_code='te', next=request.full_path) }}">TE</a>
  </div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">SK</div>
        <div class="auth-brand-text">
          <div class="auth-app">{{ t('app_name') }}</div>
          <div class="auth-muted">{{ t('forgot_subtitle') }}</div>
        </div>
      </div>

      <h1 class="auth-title">{{ t('forgot_title') }}</h1>

      <div id="toast-container" class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="toast {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <form method="POST" class="auth-form">
        <label class="auth-label" for="email">{{ t('forgot_email_label') }}</label>
        <input class="auth-input" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required />
        <button class="auth-btn" type="submit">{{ t('forgot_send') }}</button>
      </form>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loader = document.getElementById('emoji-loader');
      if (!loader) return;
      loader.classList.add('show');
      setTimeout(() => loader.classList.remove('show'), 1000);

      // Toasts
      const toasts = document.querySelectorAll('.toast');
      toasts.forEach((t, i) => {
        setTimeout(() => t.classList.add('show'), 50 + i * 200);
        setTimeout(() => t.classList.remove('show'), 4500 + i * 200);
      });
    });
  </script>
</body>
</html>
